# Nginx reverse proxy configuration for the single-tenant EnergyFox CRM.
# Serves one domain: the frontend at / and the Django backend at /api, /sys-admin.
#
# This is the plain-HTTP config, used before TLS is enabled (bare-IP deploys).
# `deploy/enable-tls.sh` generates nginx-tls.conf from nginx-tls.conf.template
# and points NGINX_CONF in .env at it; see deploy/EC2_DOCKER_DEPLOY.md.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    # Replace with the EnergyFox domain, e.g. crm.energyfox.com
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Max upload size (for CSV imports, invoices, etc.)
    client_max_body_size 50M;

    # API and backend routes
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin
    location /sys-admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (collected by Django)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (user uploads)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ACME http-01 challenge. Certbot writes the token under this webroot and
    # Let's Encrypt fetches it over plain HTTP — so this has to be served here,
    # before any certificate exists, and stay reachable for every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to the Next.js frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
